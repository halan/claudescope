name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all JSON files parse
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit $fail

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.7.4
      - name: Lint correlator
        run: ruff check correlator/
      - name: Format check correlator
        run: ruff format --check correlator/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck install.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          severity: warning
