receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Transforma atributos do log em labels do Loki (skill, tool, etc.)
  attributes/loki_labels:
    actions:
      - key: loki.attribute.labels
        value: event.name,tool_name,model,user.id,session.id
        action: insert

exporters:
  # Metrics → Prometheus (scrape on /metrics port 8889)
  # NOTE: metric_expiration defaults to 5 minutes — if Claude Code stops pushing
  # for that long (idle, long thinking, etc.) all claude_code_* metrics vanish
  # from /metrics and Prometheus shows "No data" until the next push. Extended
  # to 24h so the dashboard stays continuous through normal usage gaps.
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 24h
    resource_to_telemetry_conversion:
      enabled: true

  # Logs/events → Loki
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Útil pra debug — descomente se quiser ver no `docker logs`
  # debug:
  #   verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [attributes/loki_labels, batch]
      exporters: [otlphttp/loki]
