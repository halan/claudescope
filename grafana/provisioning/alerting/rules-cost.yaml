apiVersion: 1

# Cost-related alert rules.
#
# Default threshold for the daily cap is $10/day. Adjust the `params: [10]`
# value on the B query below to taste.
groups:
  - orgId: 1
    name: cost-alerts
    folder: claudescope
    interval: 1m
    rules:
      - uid: claudescope-daily-cost-cap
        title: Daily cost cap exceeded
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(claude_code_cost_usage_USD_total[24h]))
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [10]
        annotations:
          summary: "Claude Code daily spend crossed the cap"
          description: |
            Cumulative Claude Code cost in the last 24h is over $10.
            Current value: {{ $values.A.Value | printf "%.2f" }} USD.
        labels:
          severity: warning
          component: cost
