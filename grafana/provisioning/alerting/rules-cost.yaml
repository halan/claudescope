apiVersion: 1

# Cost-related alert rules.
#
# Default threshold for the daily cap is $10/day. Adjust the `params: [10]`
# value on the B query below to taste.
groups:
  - orgId: 1
    name: cost-alerts
    folder: claudescope
    interval: 1m
    rules:
      - uid: claudescope-daily-cost-cap
        title: Daily cost cap exceeded
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: sum(increase(claude_code_cost_usage_USD_total[24h]))
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [10]
        annotations:
          summary: "Claude Code daily spend crossed the cap"
          description: |
            Cumulative Claude Code cost in the last 24h is over $10.
            Current value: {{ $values.A.Value | printf "%.2f" }} USD.
        labels:
          severity: warning
          component: cost

      - uid: claudescope-expensive-session
        title: Expensive single session
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              # Peak per-session cost increment in the last hour.
              # `increase()` (not raw total) so the alert tracks live burn and
              # resolves once the session goes quiet — otherwise a long-lived
              # session whose total once crossed the cap would alert forever.
              expr: max(sum by (session_id) (increase(claude_code_cost_usage_USD_total[1h])))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [5] }
        annotations:
          summary: "A single Claude Code session burned over $5 in the last hour"
          description: |
            Peak per-session spend in the last hour: {{ $values.A.Value | printf "%.2f" }} USD.
            Open Grafana → Where do tokens go to identify which session_id and skill.
        labels:
          severity: warning
          component: cost

      - uid: claudescope-skill-cost-runaway
        title: Skill cost runaway
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              # `claude_code_skill_cost_usd` is a gauge (24h sliding window
              # published by the correlator), so delta() is the right tool
              # here — rate() would error on a non-counter. Negative deltas
              # (idle, spend rolling out of window) are filtered by `> 3`.
              expr: max by (skill) (delta(claude_code_skill_cost_usd[1h]))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: { type: gt, params: [3] }
        annotations:
          summary: "Skill {{ $labels.skill }} burned > $3 in the last hour"
          description: |
            Per-skill spend change over the last hour: {{ $values.A.Value | printf "%.2f" }} USD.
            Open the "Cost by skill" panel in Grafana to investigate.
        labels:
          severity: warning
          component: cost
          skill: "{{ $labels.skill }}"
