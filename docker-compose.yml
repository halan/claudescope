name: claudescope

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: claude-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (Claude Code pushes here)
      - "4318:4318"   # OTLP HTTP (alternative)
      - "8889:8889"   # Prometheus exporter (scraped internally)
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: claude-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=60d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.2.1
    container_name: claude-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:11.3.0
    container_name: claude-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  correlator:
    build: ./correlator
    container_name: claude-correlator
    environment:
      LOKI_URL: http://loki:3100
      WINDOW_HOURS: "24"
      INTERVAL_SECONDS: "30"
    depends_on: [loki]

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
